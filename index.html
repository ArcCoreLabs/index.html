<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Python · Sec Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090f;
  --card: #0f1318;
  --card2: #161c24;
  --border: #1e2730;
  --green: #00ff87;
  --green2: #00c96a;
  --green-glow: rgba(0,255,135,0.15);
  --cyan: #00cfff;
  --orange: #ff8c42;
  --red: #ff4466;
  --purple: #b06dff;
  --yellow: #ffd166;
  --text: #d4dde8;
  --muted: #4a5a6a;
  --font-mono: 'JetBrains Mono', monospace;
  --font-display: 'Syne', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-display);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  overflow-x: hidden;
}

/* ─── NOISE TEXTURE ─── */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:0;
  opacity:.6;
}

.wrap { position:relative; z-index:1; padding: 0 0 100px; }

/* ─── HEADER ─── */
.header {
  padding: 20px 20px 0;
  position: sticky;
  top: 0;
  background: rgba(7,9,15,0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 100;
  border-bottom: 1px solid var(--border);
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.logo {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--green);
  letter-spacing: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.logo-dot {
  width: 7px; height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2s infinite;
}

@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(0.8)} }

.streak-badge {
  background: rgba(255,140,66,0.12);
  border: 1px solid rgba(255,140,66,0.25);
  color: var(--orange);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 10px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.header-title {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1;
  margin-bottom: 16px;
}

.header-title span { color: var(--green); }

/* ─── PROGRESS RING + STATS ─── */
.stats-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding-bottom: 16px;
}

.ring-wrap {
  position: relative;
  width: 72px;
  height: 72px;
  flex-shrink: 0;
}

.ring-wrap svg { transform: rotate(-90deg); }

.ring-bg { fill: none; stroke: var(--border); stroke-width: 5; }
.ring-fill {
  fill: none;
  stroke: var(--green);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 188.5;
  stroke-dashoffset: 188.5;
  transition: stroke-dashoffset 0.8s cubic-bezier(.4,0,.2,1);
  filter: drop-shadow(0 0 6px var(--green));
}

.ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.ring-pct {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  color: var(--green);
  line-height: 1;
}

.ring-label {
  font-size: 8px;
  color: var(--muted);
  font-family: var(--font-mono);
  margin-top: 2px;
}

.mini-stats {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.mini-stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
}

.mini-stat-num {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
}

.mini-stat-label {
  font-size: 9px;
  color: var(--muted);
  font-family: var(--font-mono);
  letter-spacing: 1px;
  margin-top: 3px;
}

/* ─── FILTER TABS ─── */
.filter-scroll {
  overflow-x: auto;
  scrollbar-width: none;
  padding: 14px 20px 0;
  display: flex;
  gap: 8px;
}

.filter-scroll::-webkit-scrollbar { display: none; }

.filter-btn {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.filter-btn.active {
  background: var(--green-glow);
  border-color: rgba(0,255,135,0.3);
  color: var(--green);
}

/* ─── SECTION HEADERS ─── */
.section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 22px 20px 10px;
}

.section-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.section-name {
  font-size: 11px;
  font-family: var(--font-mono);
  letter-spacing: 2px;
  font-weight: 600;
}

.section-count {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--muted);
  margin-left: auto;
}

/* ─── TOPIC CARDS ─── */
.topics-list { padding: 0 16px; display: flex; flex-direction: column; gap: 6px; }

.topic-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.18s;
  -webkit-user-select: none;
  user-select: none;
  position: relative;
  overflow: hidden;
}

.topic-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
  transition: background 0.2s;
  border-radius: 14px 0 0 14px;
}

.topic-card:active { transform: scale(0.98); }

.topic-card.done {
  background: rgba(0,255,135,0.04);
  border-color: rgba(0,255,135,0.18);
}

.topic-card.done::before { background: var(--green); }

.topic-num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  min-width: 24px;
  font-weight: 600;
}

.topic-card.done .topic-num { color: var(--green); }

.topic-info { flex: 1; min-width: 0; }

.topic-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}

.topic-card.done .topic-name {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: rgba(0,255,135,0.4);
}

.topic-sub {
  font-size: 11px;
  color: var(--muted);
  font-family: var(--font-mono);
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.check-circle {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  font-size: 13px;
}

.topic-card.done .check-circle {
  background: var(--green);
  border-color: var(--green);
  box-shadow: 0 0 12px rgba(0,255,135,0.4);
  color: #000;
  font-weight: 900;
}

/* ─── BOTTOM NAV ─── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(10,13,20,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 10px 0 max(10px, env(safe-area-inset-bottom));
  z-index: 200;
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 6px 0;
  transition: all 0.15s;
  background: none;
  border: none;
}

.nav-icon { font-size: 20px; line-height: 1; }
.nav-label {
  font-size: 9px;
  font-family: var(--font-mono);
  letter-spacing: 1px;
  color: var(--muted);
  transition: color 0.15s;
}

.nav-btn.active .nav-label { color: var(--green); }
.nav-btn.active .nav-icon { filter: drop-shadow(0 0 4px var(--green)); }

/* ─── VIEWS ─── */
.view { display: none; }
.view.active { display: block; }

/* ─── DAILY VIEW ─── */
.daily-header {
  padding: 20px 20px 0;
}

.date-display {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.daily-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 16px;
}

.daily-title span { color: var(--green); }

/* Daily suggestion card */
.suggest-card {
  margin: 0 16px 20px;
  background: linear-gradient(135deg, rgba(0,255,135,0.08), rgba(0,207,255,0.05));
  border: 1px solid rgba(0,255,135,0.2);
  border-radius: 16px;
  padding: 18px;
}

.suggest-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--green);
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.suggest-topic {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 4px;
}

.suggest-sub {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--font-mono);
  margin-bottom: 14px;
}

.suggest-btn {
  background: var(--green);
  color: #000;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  cursor: pointer;
  transition: all 0.15s;
}

.suggest-btn:active { transform: scale(0.96); opacity: 0.85; }

/* Weekly calendar */
.week-row {
  display: flex;
  gap: 6px;
  padding: 0 16px;
  margin-bottom: 20px;
}

.week-day {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 4px;
  text-align: center;
}

.week-day.today {
  border-color: rgba(0,255,135,0.3);
  background: rgba(0,255,135,0.06);
}

.week-day-name {
  font-size: 9px;
  font-family: var(--font-mono);
  color: var(--muted);
  margin-bottom: 4px;
}

.week-day.today .week-day-name { color: var(--green); }

.week-day-num {
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font-mono);
}

.week-day-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  margin: 4px auto 0;
  background: var(--border);
}

.week-day.has-activity .week-day-dot { background: var(--green); box-shadow: 0 0 4px var(--green); }

/* Recent activity */
.activity-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }

.activity-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
}

.activity-icon { font-size: 16px; }
.activity-info { flex: 1; }
.activity-name { font-size: 13px; font-weight: 600; }
.activity-time { font-size: 10px; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; }
.activity-check { color: var(--green); font-size: 14px; }

/* ─── STATS VIEW ─── */
.stats-view { padding: 20px 16px 0; }

.stats-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 20px;
}

.stats-title span { color: var(--green); }

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 12px;
}

.stat-card-label {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.stat-card-value {
  font-size: 36px;
  font-family: var(--font-mono);
  font-weight: 700;
  line-height: 1;
}

.phase-progress { display: flex; flex-direction: column; gap: 10px; }

.phase-bar-item { }

.phase-bar-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}

.phase-bar-name { font-size: 12px; font-weight: 600; }
.phase-bar-count { font-size: 11px; font-family: var(--font-mono); color: var(--muted); }

.phase-bar-bg {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}

.phase-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.8s cubic-bezier(.4,0,.2,1);
}

.reset-btn-small {
  width: 100%;
  margin-top: 8px;
  background: transparent;
  border: 1px solid rgba(255,68,102,0.3);
  color: var(--red);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 2px;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
}

.reset-btn-small:active { background: rgba(255,68,102,0.08); }

/* ─── ANIMATIONS ─── */
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.topic-card { animation: fadeIn 0.2s ease both; }

/* completion flash */
@keyframes flash-green {
  0%{background:rgba(0,255,135,0.2)}
  100%{background:rgba(0,255,135,0.04)}
}
.topic-card.done.just-done { animation: flash-green 0.4s ease; }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ═══ VIEW: TRACKER ═══ -->
  <div class="view active" id="view-tracker">

    <div class="header">
      <div class="header-top">
        <div class="logo">
          <div class="logo-dot"></div>
          PYTHON·SEC
        </div>
        <div class="streak-badge" id="streak-badge">🔥 0 días</div>
      </div>
      <div class="header-title">Mi <span>Progreso</span></div>
      <div class="stats-row">
        <div class="ring-wrap">
          <svg width="72" height="72" viewBox="0 0 72 72">
            <circle class="ring-bg" cx="36" cy="36" r="30"/>
            <circle class="ring-fill" id="ring-fill" cx="36" cy="36" r="30"/>
          </svg>
          <div class="ring-text">
            <div class="ring-pct" id="ring-pct">0%</div>
            <div class="ring-label">DONE</div>
          </div>
        </div>
        <div class="mini-stats">
          <div class="mini-stat">
            <div class="mini-stat-num" id="ms-done" style="color:var(--green)">0</div>
            <div class="mini-stat-label">HECHOS</div>
          </div>
          <div class="mini-stat">
            <div class="mini-stat-num" id="ms-left" style="color:var(--cyan)">60</div>
            <div class="mini-stat-label">FALTAN</div>
          </div>
          <div class="mini-stat">
            <div class="mini-stat-num" id="ms-streak" style="color:var(--orange)">0</div>
            <div class="mini-stat-label">RACHA</div>
          </div>
          <div class="mini-stat">
            <div class="mini-stat-num" id="ms-days" style="color:var(--purple)">0</div>
            <div class="mini-stat-label">DÍAS ACT.</div>
          </div>
        </div>
      </div>

      <div class="filter-scroll" id="filter-scroll">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">TODOS</button>
        <button class="filter-btn" data-filter="pending" onclick="setFilter('pending',this)">PENDIENTES</button>
        <button class="filter-btn" data-filter="done" onclick="setFilter('done',this)">COMPLETADOS</button>
        <button class="filter-btn" data-filter="0" onclick="setFilter('0',this)">FUNDAMENTOS</button>
        <button class="filter-btn" data-filter="1" onclick="setFilter('1',this)">INTERMEDIO</button>
        <button class="filter-btn" data-filter="2" onclick="setFilter('2',this)">REDES/SISTEMA</button>
        <button class="filter-btn" data-filter="3" onclick="setFilter('3',this)">SEGURIDAD</button>
      </div>
    </div>

    <div id="topics-container" style="padding-top:14px;"></div>
  </div>

  <!-- ═══ VIEW: DAILY ═══ -->
  <div class="view" id="view-daily">
    <div class="daily-header">
      <div class="date-display" id="date-display">─</div>
      <div class="daily-title">Hoy <span>estudias</span></div>
    </div>

    <div class="suggest-card" id="suggest-card">
      <div class="suggest-label">// TEMA SUGERIDO</div>
      <div class="suggest-topic" id="sug-topic">─</div>
      <div class="suggest-sub" id="sug-sub">─</div>
      <button class="suggest-btn" onclick="markSuggested()">✓ MARCAR COMO DOMINADO</button>
    </div>

    <div style="padding:0 16px 10px">
      <div style="font-size:11px;font-family:var(--font-mono);color:var(--muted);letter-spacing:2px;margin-bottom:10px;">// ESTA SEMANA</div>
    </div>
    <div class="week-row" id="week-row"></div>

    <div style="padding:0 16px 10px">
      <div style="font-size:11px;font-family:var(--font-mono);color:var(--muted);letter-spacing:2px;margin-bottom:10px;">// ÚLTIMOS DOMINADOS</div>
    </div>
    <div class="activity-list" id="activity-list">
      <div class="empty-state">AÚN NO HAY ACTIVIDAD</div>
    </div>
  </div>

  <!-- ═══ VIEW: STATS ═══ -->
  <div class="view" id="view-stats">
    <div class="stats-view">
      <div class="stats-title">Tus <span>Stats</span></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
        <div class="stat-card">
          <div class="stat-card-label">COMPLETADOS</div>
          <div class="stat-card-value" id="sv-done" style="color:var(--green)">0</div>
          <div style="font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-top:4px;">de 60 temas</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">RACHA ACTUAL</div>
          <div class="stat-card-value" id="sv-streak" style="color:var(--orange)">0</div>
          <div style="font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-top:4px;">días seguidos</div>
        </div>
      </div>

      <div class="stat-card" style="margin-bottom:12px;">
        <div class="stat-card-label">// AVANCE POR SECCIÓN</div>
        <div style="margin-top:14px;" class="phase-progress" id="phase-progress"></div>
      </div>

      <div class="stat-card" style="margin-bottom:12px;">
        <div class="stat-card-label">DÍAS ACTIVO</div>
        <div class="stat-card-value" id="sv-days" style="color:var(--purple)">0</div>
        <div style="font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-top:4px;">días estudiando</div>
      </div>

      <button class="reset-btn-small" onclick="resetAll()">⟳ REINICIAR TODO EL PROGRESO</button>
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-tracker" onclick="showView('tracker')">
    <span class="nav-icon">📋</span>
    <span class="nav-label">TEMAS</span>
  </button>
  <button class="nav-btn" id="nav-daily" onclick="showView('daily')">
    <span class="nav-icon">⚡</span>
    <span class="nav-label">HOY</span>
  </button>
  <button class="nav-btn" id="nav-stats" onclick="showView('stats')">
    <span class="nav-icon">📊</span>
    <span class="nav-label">STATS</span>
  </button>
</nav>

<script>
// ═══════════════════════════════════════
// DATA
// ═══════════════════════════════════════
const SECTIONS = [
  {
    id: 0,
    name: 'FUNDAMENTOS',
    color: '#00ff87',
    topics: [
      { name: 'Variables y tipos de datos', sub: 'int, str, float, bool, None' },
      { name: 'Operadores', sub: 'aritméticos, lógicos, comparación' },
      { name: 'Strings y métodos', sub: 'upper, split, format, f-strings' },
      { name: 'Input / Output', sub: 'print(), input(), formateo' },
      { name: 'Condicionales', sub: 'if / elif / else' },

// Flatten topics with global index
let allTopics = [];
let topicNum = 1;
SECTIONS.forEach(sec => {
  sec.topics.forEach(t => {
    allTopics.push({ ...t, secId: sec.id, num: topicNum++, color: sec.color });
  });
});

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
const KEY = 'pysec_tracker_v2';
let state = {};

function load() {
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { state = {}; }
  if (!state.done) state.done = {};
  if (!state.doneAt) state.doneAt = {};
  if (!state.activeDays) state.activeDays = {};
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}

// ═══════════════════════════════════════
// STREAK & DAYS
// ═══════════════════════════════════════
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function recordToday() {
  state.activeDays[todayStr()] = true;
  save();
}

function calcStreak() {
  const days = Object.keys(state.activeDays).sort().reverse();
  if (!days.length) return 0;
  let streak = 0;
  let d = new Date();
  for (let i = 0; i < 365; i++) {
    const s = d.toISOString().slice(0, 10);
    if (state.activeDays[s]) { streak++; }
    else if (i > 0) break;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

// ═══════════════════════════════════════
// FILTER
// ═══════════════════════════════════════
let currentFilter = 'all';

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTopics();
}

// ═══════════════════════════════════════
// RENDER TRACKER
// ═══════════════════════════════════════
function renderTopics() {
  const container = document.getElementById('topics-container');
  container.innerHTML = '';

  SECTIONS.forEach(sec => {
    const filtered = sec.topics.map((t, i) => {
      const gIdx = allTopics.findIndex(a => a.secId === sec.id && a.name === t.name);
      return { ...t, gIdx, num: allTopics[gIdx].num, color: sec.color, secId: sec.id };
    }).filter(t => {
      if (currentFilter === 'done') return state.done[t.gIdx];
      if (currentFilter === 'pending') return !state.done[t.gIdx];
      if (currentFilter === 'all') return true;
      return String(t.secId) === currentFilter;
    });

    if (!filtered.length) return;

    const doneInSec = filtered.filter(t => state.done[t.gIdx]).length;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `
      <div class="section-dot" style="background:${sec.color};box-shadow:0 0 6px ${sec.color}44"></div>
      <div class="section-name" style="color:${sec.color}">${sec.name}</div>
      <div class="section-count">${doneInSec}/${filtered.length}</div>
    `;
    container.appendChild(head);

    const list = document.createElement('div');
    list.className = 'topics-list';

    filtered.forEach((t, i) => {
      const card = document.createElement('div');
      card.className = 'topic-card' + (state.done[t.gIdx] ? ' done' : '');
      card.style.animationDelay = (i * 0.03) + 's';
      card.onclick = () => toggleTopic(t.gIdx, card);
      card.innerHTML = `
        <div class="topic-num">${String(t.num).padStart(2,'0')}</div>
        <div class="topic-info">
          <div class="topic-name">${t.name}</div>
          <div class="topic-sub">${t.sub}</div>
        </div>
        <div class="check-circle">${state.done[t.gIdx] ? '✓' : ''}</div>
      `;
      list.appendChild(card);
    });

    container.appendChild(list);
  });

  updateStats();
}

function toggleTopic(idx, card) {
  if (state.done[idx]) {
    delete state.done[idx];
    delete state.doneAt[idx];
    card.classList.remove('done');
    card.querySelector('.check-circle').innerHTML = '';
  } else {
    state.done[idx] = true;
    state.doneAt[idx] = new Date().toISOString();
    card.classList.add('done', 'just-done');
    card.querySelector('.check-circle').innerHTML = '✓';
    setTimeout(() => card.classList.remove('just-done'), 400);
    recordToday();
  }
  save();
  updateStats();
  if (document.getElementById('view-daily').classList.contains('active')) renderDaily();
}

// ═══════════════════════════════════════
// UPDATE STATS
// ═══════════════════════════════════════
function updateStats() {
  const total = allTopics.length;
  const done = Object.keys(state.done).length;
  const pct = Math.round((done / total) * 100);
  const streak = calcStreak();
  const days = Object.keys(state.activeDays).length;

  // Ring
  const circumference = 188.5;
  const offset = circumference - (pct / 100) * circumference;
  document.getElementById('ring-fill').style.strokeDashoffset = offset;
  document.getElementById('ring-pct').textContent = pct + '%';

  // Mini stats
  document.getElementById('ms-done').textContent = done;
  document.getElementById('ms-left').textContent = total - done;
  document.getElementById('ms-streak').textContent = streak;
  document.getElementById('ms-days').textContent = days;

  // Streak badge
  document.getElementById('streak-badge').textContent = '🔥 ' + streak + ' días';

  // Stats view
  document.getElementById('sv-done').textContent = done;
  document.getElementById('sv-streak').textContent = streak;
  document.getElementById('sv-days').textContent = days;

  // Phase progress bars
  const phaseProgress = document.getElementById('phase-progress');
  if (phaseProgress) {
    phaseProgress.innerHTML = SECTIONS.map(sec => {
      const secTopics = allTopics.filter(t => t.secId === sec.id);
      const secDone = secTopics.filter(t => state.done[allTopics.indexOf(t)]).length;
      const secPct = Math.round((secDone / secTopics.length) * 100);
      return `
        <div class="phase-bar-item">
          <div class="phase-bar-header">
            <div class="phase-bar-name" style="color:${sec.color}">${sec.name}</div>
            <div class="phase-bar-count">${secDone}/${secTopics.length}</div>
          </div>
          <div class="phase-bar-bg">
            <div class="phase-bar-fill" style="width:${secPct}%;background:${sec.color};box-shadow:0 0 6px ${sec.color}44"></div>
          </div>
        </div>
      `;
    }).join('');
  }
}

// ═══════════════════════════════════════
// DAILY VIEW
// ═══════════════════════════════════════
function renderDaily() {
  // Date
  const now = new Date();
  const days = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
  const months = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  document.getElementById('date-display').textContent =
    `// ${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

  // Next pending topic
  const nextIdx = allTopics.findIndex((t, i) => !state.done[i]);
  const sc = document.getElementById('suggest-card');
  if (nextIdx === -1) {
    document.getElementById('sug-topic').textContent = '🎉 ¡TODOS COMPLETADOS!';
    document.getElementById('sug-sub').textContent = 'Eres un crack. Ahora a hackear el mundo.';
    sc.style.borderColor = 'rgba(0,255,135,0.4)';
  } else {
    const t = allTopics[nextIdx];
    document.getElementById('sug-topic').textContent = `${String(t.num).padStart(2,'0')}. ${t.name}`;
    document.getElementById('sug-sub').textContent = t.sub;
    sc.style.borderColor = `rgba(${hexToRgb(t.color)},0.3)`;
    sc._sugIdx = nextIdx;
  }

  // Week
  const weekRow = document.getElementById('week-row');
  weekRow.innerHTML = '';
  const dayNames = ['D','L','M','X','J','V','S'];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const ds = d.toISOString().slice(0,10);
    const isToday = i === 0;
    const hasAct = !!state.activeDays[ds];
    const div = document.createElement('div');
    div.className = 'week-day' + (isToday ? ' today' : '') + (hasAct ? ' has-activity' : '');
    div.innerHTML = `
      <div class="week-day-name">${dayNames[d.getDay()]}</div>
      <div class="week-day-num">${d.getDate()}</div>
      <div class="week-day-dot"></div>
    `;
    weekRow.appendChild(div);
  }

  // Recent activity
  const al = document.getElementById('activity-list');
  const recentEntries = Object.entries(state.doneAt)
    .sort((a,b) => b[1].localeCompare(a[1]))
    .slice(0, 5);

  if (!recentEntries.length) {
    al.innerHTML = '<div class="empty-state">AÚN NO HAY ACTIVIDAD<br><br>Marca tu primer tema ✓</div>';
    return;
  }

  al.innerHTML = recentEntries.map(([idx, iso]) => {
    const t = allTopics[idx];
    if (!t) return '';
    const d = new Date(iso);
    const timeStr = d.toLocaleDateString('es', { day:'numeric', month:'short' }) + ' · ' +
      d.toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
    return `
      <div class="activity-item">
        <div class="activity-icon">🐍</div>
        <div class="activity-info">
          <div class="activity-name">${t.name}</div>
          <div class="activity-time">${timeStr}</div>
        </div>
        <div class="activity-check">✓</div>
      </div>
    `;
  }).join('');
}

function markSuggested() {
  const card = document.getElementById('suggest-card');
  const idx = card._sugIdx;
  if (idx === undefined || idx === -1) return;
  if (!state.done[idx]) {
    state.done[idx] = true;
    state.doneAt[idx] = new Date().toISOString();
    recordToday();
    save();
    updateStats();
    renderTopics();
    renderDaily();
    // Small haptic hint
    if (navigator.vibrate) navigator.vibrate(50);
  }
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

// ═══════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'daily') renderDaily();
  if (name === 'stats') updateStats();
}

// ═══════════════════════════════════════
// RESET
// ═══════════════════════════════════════
function resetAll() {
  if (!confirm('¿Reiniciar todo? Se borrará tu progreso.')) return;
  state = { done: {}, doneAt: {}, activeDays: {} };
  save();
  renderTopics();
  renderDaily();
  updateStats();
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
load();
renderTopics();
updateStats();
</script>
